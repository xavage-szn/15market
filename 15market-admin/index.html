<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; worker-src * blob:; connect-src * 'unsafe-inline' 'unsafe-eval' wss:; img-src * data: blob:; style-src * 'unsafe-inline'; font-src * data:;">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>15market Admin</title>
  <style>
    #root:empty {
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3CB371;
      font-family: sans-serif;
    }
  </style>
  <script>
    window.addEventListener('error', function (e) {
      console.error('SYSTEM_CRASH_DETECTED:', e.message);
      const root = document.getElementById('root');
      if (root && root.innerHTML === '') {
        root.innerHTML = '<div style="padding:40px; text-align:center;"><h2>Initialization Error</h2><p>' + e.message + '</p><p>Check console for details.</p></div>';
      }
    });
  </script>
</head>

<body>
  <script>
    window.global = window;
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
