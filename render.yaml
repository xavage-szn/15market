services:
  # Backend Service
  - type: web
    name: 15market-backend
    env: node
    rootDir: nexus-core
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3010
      - key: NODE_ENV
        value: production
      # These should be set in the Render Dashboard for security, but listed here for clarity
      - fromContext: env
        key: PRIVATE_KEY
      - fromContext: env
        key: ARC_CONTRACT_ADDRESS
      - fromContext: env
        key: REDIS_URL
      - fromContext: env
        key: ROUNDS_CONTRACT_ADDRESS
      - fromContext: env
        key: ADMIN_TOKEN

  # Frontend Service (Static Site)
  - type: static
    name: 15market-frontend
    env: static
    rootDir: 15market
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_KEEPER_URL
        value: https://api.15market.online
      - key: VITE_KEEPER_URL_ARC
        value: https://api.15market.online
      - key: VITE_TURNKEY_ORGANIZATION_ID
        value: 29276b8b-8776-4c78-8c2e-c63cc6dde605
      - key: VITE_TURNKEY_AUTH_PROXY_CONFIG_ID
        value: 562519f9-2589-45e7-be1f-5fc06da1d19b
      - key: VITE_TURNKEY_API_BASE_URL
        value: https://api.turnkey.com
      - key: VITE_TURNKEY_RP_ID
        value: 15market.online

  # Admin Frontend Service (Static Site)
  - type: static
    name: 15market-admin
    env: static
    rootDir: 15market-admin
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_KEEPER_URL
        value: https://15market-backend.onrender.com
      - key: VITE_KEEPER_URL_ARC
        value: https://15market-backend.onrender.com
