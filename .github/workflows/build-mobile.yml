name: Build Mobile App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 15market/package-lock.json

      - name: Install Dependencies
        working-directory: ./15market
        run: npm install

      - name: Build Web Assets
        working-directory: ./15market
        run: npm run build

      - name: Upload Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: 15market/dist/

  build-android:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web Assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: 15market/dist

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Capacitor Sync
        working-directory: ./15market
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./15market/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 15market-android-debug
          path: 15market/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web Assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: 15market/dist

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Capacitor Sync
        working-directory: ./15market
        run: npx cap sync ios

      - name: Build iOS (Check)
        working-directory: ./15market/ios/App
        run: |
          xcodebuild -scheme App -workspace App.xcworkspace -sdk iphoneos -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Project
        uses: actions/upload-artifact@v4
        with:
          name: 15market-ios-project
          path: 15market/ios/
