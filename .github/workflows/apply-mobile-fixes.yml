name: Apply mobile trade UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile outcome, settlement state, and watermark
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          widget = Path('15market/src/components/TradingWidget.jsx')
          text = widget.read_text()
          text = re.sub(
              r'className=\{`(?:w-\[min\(100%,calc\(100vw-2rem\)\)\] max-w-full min-w-0 mx-auto )?px-3 py-2 sm:px-5 sm:py-2\.5 rounded-\[24px\] border flex items-center justify-center gap-2(?:\.5)? select-none shadow-lg \$\{cardClass\}`\}',
              'className={`w-[min(100%,16rem)] max-w-full min-w-0 mx-auto px-2.5 py-1.5 sm:w-[18rem] sm:px-4 sm:py-2 rounded-[20px] border flex items-center justify-center gap-2 select-none shadow-lg ${cardClass}`}',
              text,
              count=1,
          )
          text = text.replace(
              'className={`block min-w-0 text-center text-[13px] sm:text-[15px] font-black italic tracking-[0.18em] sm:tracking-widest ${textClass}`}',
              'className={`block min-w-0 text-center text-[12px] sm:text-[14px] font-black italic tracking-[0.12em] sm:tracking-[0.18em] ${textClass}`} ',
              1,
          )
          widget.write_text(text)

          mobile = Path('15market/src/components/MobileTradeView.jsx')
          text = mobile.read_text()

          old_effect = '''  const [settledTrade, setSettledTrade] = useState(null);
  const [showOutcome, setShowOutcome] = useState(false);

  // Detect when a trade settles
  useEffect(() => {
    if (!activeTrades || activeTrades.length === 0) return;
    const settled = activeTrades.find(t => ['WON', 'LOST', 'PAID'].includes(t.status));
    if (settled && !currentActiveTrade && !isExecuting) {
      setSettledTrade(settled);
      setShowOutcome(true);
      const timer = setTimeout(() => {
        setShowOutcome(false);
        setSettledTrade(null);
      }, 3000);
      return () => clearTimeout(timer);
    }
  }, [activeTrades, currentActiveTrade, isExecuting]);'''
          new_effect = '''  const [settledTrade, setSettledTrade] = useState(null);
  const [showOutcome, setShowOutcome] = useState(false);
  const settledTradeIdRef = useRef(null);

  // Display each authoritative settlement once. The feed may retain the
  // settled trade, so do not restart the outcome timer on every render/update.
  useEffect(() => {
    const settled = activeTrades?.find(t => ['WON', 'LOST', 'PAID'].includes(t.status));
    if (!settled || currentActiveTrade || isExecuting) return;

    const settlementId = String(settled.id ?? `${settled.timestamp ?? settled.settledAt ?? ''}-${settled.status}`);
    if (settledTradeIdRef.current === settlementId) return;
    settledTradeIdRef.current = settlementId;

    setSettledTrade(settled);
    setShowOutcome(true);
    const timer = setTimeout(() => {
      setShowOutcome(false);
      setSettledTrade(null);
    }, 3000);
    return () => clearTimeout(timer);
  }, [activeTrades, currentActiveTrade, isExecuting]);'''
          if old_effect not in text:
              raise SystemExit('settlement effect not found')
          text = text.replace(old_effect, new_effect, 1)

          text = text.replace(
              "const expiry = currentActiveTrade.expiryMs || (currentActiveTrade.startTime + totalMs);",
              "const startTime = currentActiveTrade.startTime || currentActiveTrade.createdAt || currentActiveTrade.timestamp || Date.now();\n      const expiry = currentActiveTrade.expiryMs || (startTime + totalMs);",
              1,
          )
          text = text.replace(
              ") : currentActiveTrade && currentActiveTrade.status === 'PENDING' ? (",
              ") : currentActiveTrade && currentActiveTrade.status === 'PENDING' && remainingSec > 0 ? (",
              1,
          )
          text = text.replace(
              "<div className=\"absolute inset-0 flex items-center justify-center pointer-events-none z-0\">\n        <img\n          src=\"/logo.SVG\"",
              "<div className=\"absolute inset-0 flex items-center justify-center pointer-events-none z-10\">\n        <img\n          src=\"/logo.png\"",
              1,
          )
          text = text.replace(
              'className="canvasRef"',
              'className="canvasRef"',
          )
          text = text.replace(
              '<canvas ref={canvasRef} className="w-full h-full block relative z-10" />',
              '<canvas ref={canvasRef} className="w-full h-full block relative z-20" />',
              1,
          )
          mobile.write_text(text)
          PY

      - name: Commit source changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 15market/src/components/MobileTradeView.jsx 15market/src/components/TradingWidget.jsx
          git commit -m "Fix mobile settlement result and chart watermark" || true
          git rm .github/workflows/apply-mobile-fixes.yml
          git commit -m "Remove temporary mobile fix workflow"
          git push
